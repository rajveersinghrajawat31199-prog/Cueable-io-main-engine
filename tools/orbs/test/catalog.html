<!doctype html><meta charset="utf-8"><title>Orbs catalog</title>
<style>body{margin:0;background:#0b0b0e;font:12px system-ui;color:#999;padding:12px}.g{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}.c{text-align:center}.r{margin:14px 0 4px}</style>
<div id="g"></div>
<script>document.write('<script src="../dist/orbs.bundle.js?v='+Date.now()+'"><\/script>')</script>
<script>
const q=new URLSearchParams(location.search),T=parseFloat(q.get('t')||'1.3');
const O=Orbs.scene(),g=document.getElementById('g');
for(const size of [64,20]){const row=document.createElement('div');row.className='g';g.appendChild(Object.assign(document.createElement('div'),{className:'r',textContent:'size '+size}));g.appendChild(row);
 Orbs.states.forEach(s=>{const c=document.createElement('div');c.className='c';c.innerHTML='<div id="o-'+s+'-'+size+'"></div>'+s;row.appendChild(c);
  O.add('#o-'+s+'-'+size,{state:s,size,px:size===64?120:60,ink:q.get('ink')||'#f2f2f5',bg:'#0b0b0e'});});}
window.O=O;O.seek(T);
</script>
