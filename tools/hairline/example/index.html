<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920, height=1080">
<title>Hairline proof</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="assets/hairline.bundle.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0b0b0e}
#stage{position:relative;width:1920px;height:1080px;background:#0b0b0e;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
.clip{position:absolute;inset:0}
.fig{position:absolute;width:560px;height:448px}
#f1{left:100px;top:300px}#f2{left:680px;top:300px}#f3{left:1260px;top:300px}
.cap{position:absolute;top:790px;width:560px;height:50px;text-align:center;color:#8a8a93;font-size:30px;letter-spacing:.02em}
#c1{left:100px}#c2{left:680px}#c3{left:1260px}
h1{position:absolute;left:100px;top:110px;width:1700px;height:100px;color:#f2f2f5;font-size:84px;font-weight:700;letter-spacing:-.03em}
.cl{--hairline-plate:#0b0b0e;--hairline-hi:#f2f2f5;--hairline-edge:#8a8a93;--hairline-mid:#4a4a52;--hairline-lo:#25252b}
</style></head>
<body>
<div id="stage" class="cl" data-composition-id="hairline-proof" data-width="1920" data-height="1080" data-start="0" data-duration="6">
  <h1 id="headline" class="clip" data-start="0" data-duration="6">Every figure answers the cursor.</h1>
  <div id="f1" class="fig clip" data-start="0" data-duration="6"></div>
  <div id="f2" class="fig clip" data-start="0" data-duration="6"></div>
  <div id="f3" class="fig clip" data-start="0" data-duration="6"></div>
  <div id="c1" class="cap clip" data-start="0" data-duration="6">terrain</div>
  <div id="c2" class="cap clip" data-start="0" data-duration="6">keyboard</div>
  <div id="c3" class="cap clip" data-start="0" data-duration="6">laptop</div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const H = Hairline.scene();
    H.add("#f1", "terrain",  { theme:"dark", intensity:.7, path:[{t:.4,x:.2,y:.7},{t:2.2,x:.8,y:.4},{t:4,x:.45,y:.55},{t:5,leave:true}] });
    H.add("#f2", "keyboard", { theme:"dark", intensity:.7, path:[{t:.8,x:.1,y:.6},{t:3,x:.9,y:.5},{t:4.6,leave:true}] });
    H.add("#f3", "laptop",   { theme:"dark", intensity:.7, path:[{t:1.2,x:.5,y:.9},{t:2.6,x:.5,y:.15},{t:4,x:.5,y:.6},{t:5.2,leave:true}] });
    H.bind(tl, 6);
    window.__timelines = window.__timelines || {};
    window.__timelines["hairline-proof"] = tl;
  </script>
</div></body></html>
